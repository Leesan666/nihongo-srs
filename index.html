<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="にほんご SRS">
<title>にほんご SRS</title>
<style>
:root{
  --purple:#6c5ce7; --purple-dark:#5649c9; --purple-light:#f0edff;
  --bg:#f4f5f9; --card:#fff; --text:#2d3436; --muted:#8b92a5;
  --line:#e8eaf0; --green:#00b894; --orange:#f39c12; --red:#e17055;
  --shadow:0 2px 16px rgba(45,52,54,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{background:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:19px;font-weight:800;letter-spacing:.3px}
.brand span{color:var(--purple)}
.streak{background:#fff6e5;color:#d68910;padding:5px 12px;border-radius:20px;font-weight:700;font-size:14px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:19}
.tabs button{flex:1;background:none;border:none;padding:12px 0;font-size:14px;color:var(--muted);font-weight:600;position:relative;cursor:pointer}
.tabs button.active{color:var(--purple)}
.tabs button.active::after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:3px;background:var(--purple);border-radius:3px 3px 0 0}
main{padding:16px}
.view{display:none}.view.active{display:block}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 14px;font-weight:700}
.stats-row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:#f7f8fc;border-radius:12px;padding:14px 6px;text-align:center}
.stat-box .num{font-size:26px;font-weight:800;line-height:1.2}
.stat-box .num.purple{color:var(--purple)}
.stat-box .num.green{color:var(--green)}
.stat-box .num.muted{color:#b2b8c5}
.stat-box .label{font-size:12px;color:var(--muted);margin-top:3px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;
  cursor:pointer;transition:transform .08s,background .15s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:disabled{background:#c9c5e8;cursor:default}
.btn-ghost{background:var(--purple-light);color:var(--purple)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto}
.source-note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}

/* Review session overlay */
.session{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
.session.active{display:flex}
.sess-head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:#fff}
.sess-head .close{border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 8px}
.sess-head .prog{font-size:14px;color:var(--muted);font-weight:600}
.progress-bar{height:4px;background:var(--line)}
.progress-bar i{display:block;height:100%;background:var(--purple);width:0;transition:width .2s}
.sess-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px;overflow-y:auto}
.flashcard{background:#fff;border-radius:20px;box-shadow:0 6px 30px rgba(45,52,54,.1);
  min-height:300px;padding:28px 20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.chip{display:inline-block;background:var(--purple-light);color:var(--purple);
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:16px}
.face{font-size:64px;font-weight:700;line-height:1.25;word-break:break-all}
.face.writing{font-size:44px}
.face.question{font-size:24px;padding:0 8px}
.face .sub{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:12px}
.tap-hint{color:var(--muted);font-size:13px;margin-top:24px}
.answer-area{width:100%;border-top:1px dashed var(--line);margin-top:22px;padding-top:18px;text-align:left}
.answer-big{font-size:46px;font-weight:800;color:var(--purple);text-align:center;margin-bottom:14px;word-break:break-all}
.answer-big.small{font-size:24px}
.field-row{margin-bottom:10px}
.field-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.field-value{font-size:15px;white-space:pre-wrap}
.audio-btn{background:var(--purple-light);color:var(--purple);border:none;border-radius:20px;
  padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;margin:0 auto 14px;display:block}
.sess-foot{padding:12px 16px calc(18px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.reveal-btn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--purple);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.grade-row{display:flex;gap:8px}
.grade{flex:1;padding:14px 4px;border:none;border-radius:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.grade:active{transform:scale(.97)}
.grade-again{background:var(--red)}.grade-hard{background:var(--orange)}.grade-good{background:var(--green)}
.grade small{display:block;font-size:10px;opacity:.85;font-weight:500;margin-top:2px}

/* Library */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filter{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid var(--line);
  background:#fff;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.filter.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  font-size:14px;margin-bottom:12px;font-family:inherit;background:#fff}
.lib-card{border-bottom:1px solid var(--line);padding:12px 0}
.lib-card:last-child{border-bottom:none}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lib-front{font-size:17px;font-weight:700}
.lib-answer{font-size:13px;color:var(--purple);font-weight:600}
.tag{font-size:11px;color:var(--muted);background:#f2f3f7;border-radius:6px;padding:2px 7px}
.lib-detail{font-size:13px;color:#555;margin-top:8px;display:none}
.lib-card.open .lib-detail{display:block}
.lib-detail div{margin-bottom:4px}

/* Stats */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-row .name{width:88px;flex:0 0 auto;color:#555}
.bar-track{flex:1;background:#f0f1f5;border-radius:8px;height:14px;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:8px}
.bar-row .val{width:30px;text-align:right;font-weight:700;color:#555}
.week{display:flex;align-items:flex-end;justify-content:space-around;height:110px;gap:6px;margin-top:8px}
.week .day{flex:1;text-align:center}
.week .bar{background:var(--purple);border-radius:5px 5px 0 0;margin:0 auto 5px;width:70%;min-height:2px}
.week .dlabel{font-size:10px;color:var(--muted)}
.week .dnum{font-size:11px;font-weight:700;color:#555}

/* Settings */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff}
.field textarea{min-height:130px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.hint-text{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.row-btns{display:flex;gap:10px}
.danger{background:#fff0ee;color:var(--red)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2d3436;color:#fff;
  padding:10px 20px;border-radius:24px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>
<body>
<header>
  <div class="brand">にほんご <span>SRS</span></div>
  <div class="streak">🔥 <span id="streakNum">0</span></div>
</header>
<nav class="tabs">
  <button data-tab="review" class="active">复习</button>
  <button data-tab="library">词库</button>
  <button data-tab="stats">统计</button>
  <button data-tab="settings">设置</button>
</nav>

<main>
<!-- 复习 -->
<section class="view active" id="view-review">
  <div class="panel">
    <h2>今日待复习</h2>
    <div class="stats-row">
      <div class="stat-box"><div class="num purple" id="dueNum">0</div><div class="label">到期复习</div></div>
      <div class="stat-box"><div class="num green" id="newNum">0</div><div class="label">新词可用</div></div>
      <div class="stat-box"><div class="num muted" id="doneNum">0</div><div class="label">今日已完成</div></div>
    </div>
    <button class="btn btn-primary" id="startBtn">开始复习（0张）</button>
    <div class="source-note">内容来自 B 站「教日语的阿飞老师」日语入门课<br>记忆调度使用 SM-2 间隔重复算法 · 进度只存在这台设备</div>
  </div>
</section>

<!-- 词库 -->
<section class="view" id="view-library">
  <div class="panel">
    <div class="filters" id="deckFilters"></div>
    <input class="search" id="searchInput" placeholder="搜索假名、读音或关键词…">
    <div id="libList"></div>
  </div>
</section>

<!-- 统计 -->
<section class="view" id="view-stats">
  <div class="panel">
    <h2>掌握情况</h2>
    <div id="masteryBars"></div>
  </div>
  <div class="panel">
    <h2>近 7 天复习</h2>
    <div class="week" id="weekChart"></div>
  </div>
  <div class="panel">
    <h2>各牌组进度</h2>
    <div id="deckProgress"></div>
  </div>
</section>

<!-- 设置 -->
<section class="view" id="view-settings">
  <div class="panel">
    <h2>学习参数</h2>
    <div class="field">
      <label>新卡数量</label>
      <div class="hint-text" style="margin-top:0">已取消每日上限：点「开始复习」会一次性引入全部未学新卡。</div>
    </div>
    <div class="field">
      <label>翻卡时自动读音</label>
      <select id="autoPlay"><option value="1">开启</option><option value="0">关闭</option></select>
      <div class="hint-text">卡片自带标准日语发音，无需联网语音包。</div>
    </div>
  </div>
  <div class="panel">
    <h2>导入新卡</h2>
    <div class="field">
      <textarea id="importText" placeholder="粘贴卡片文本…&#10;支持三种格式：&#10;① 墨墨格式：### 章节 / === 卡 / --- 答案线&#10;② 每行：正面 ⇥ 背面（Tab 分隔）&#10;③ JSON 数组：[{&quot;front&quot;:&quot;…&quot;,&quot;answer&quot;:&quot;…&quot;}]"></textarea>
      <div class="hint-text">以后做了新课的卡，把文本粘进来即可加入词库，不会覆盖现有卡片。</div>
    </div>
    <button class="btn btn-ghost" id="importBtn">导入卡片</button>
  </div>
  <div class="panel">
    <h2>数据管理</h2>
    <div class="row-btns">
      <button class="btn btn-ghost btn-sm" id="exportBtn">导出备份</button>
      <button class="btn btn-ghost btn-sm" id="restoreBtn">恢复备份</button>
    </div>
    <div class="hint-text" style="margin-top:10px">进度和自导入卡片都在这台设备的浏览器里。换手机或清缓存前请先导出备份。</div>
    <div style="margin-top:16px"><button class="btn btn-sm danger" id="resetBtn">重置全部学习进度</button></div>
  </div>
</section>
</main>

<!-- 复习会话 -->
<div class="session" id="session">
  <div class="sess-head">
    <button class="close" id="closeSession">×</button>
    <div class="prog" id="sessProg">0 / 0</div>
    <div style="width:30px"></div>
  </div>
  <div class="progress-bar"><i id="sessBar"></i></div>
  <div class="sess-body">
    <div class="flashcard" id="flashcard">
      <div class="chip" id="cardChip">认读</div>
      <div class="face" id="cardFace">あ</div>
      <div class="tap-hint" id="tapHint">点击卡片显示答案</div>
      <div class="answer-area" id="answerArea" style="display:none">
        <button class="audio-btn" id="audioBtn" style="display:none">🔊 播放发音</button>
        <div class="answer-big" id="answerBig"></div>
        <div id="answerFields"></div>
      </div>
    </div>
  </div>
  <div class="sess-foot">
    <button class="reveal-btn" id="revealBtn">显示答案</button>
    <div class="grade-row" id="gradeRow" style="display:none">
      <button class="grade grade-again" data-grade="again">忘记<small>10分钟后</small></button>
      <button class="grade grade-hard" data-grade="hard">模糊<small>短间隔</small></button>
      <button class="grade grade-good" data-grade="good">认识<small>按算法</small></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

abel":"提醒","value":"这是判断声调的起点；看到一个词先看头两个字是否不同音"}],"audio":null,"source":"05:34 / 07:08"},{"id":"p5-001","deck":"日语声调","group":"声调·规律2","type":"question","front":"日语声调第二条规律是什么？","answer":"降调后不再升回","fields":[{"label":"依据","value":"降下去之后全是低音，不会再出现『低高低高』"},{"label":"记忆方法","value":"一旦出现降音，后面的音就再也升不回去了——所以日语里绝不会有『高低高』这种大波动"},{"label":"提醒","value":"听到自己读出『高低高』，这个词一定读错了"}],"audio":null,"source":"07:09 / 08:33"},{"id":"p5-002","deck":"日语声调","group":"声调·标记","type":"question","front":"老师画线法 vs 书本标法，区别在哪？","answer":"老师标高低两线，书本只标高音","fields":[{"label":"依据","value":"老师为看得清把低音也画横线；书本只在高音字上画横线，没画的就是低音"},{"label":"记忆方法","value":"书本：只把高音写出来，空白即低音；老师：高低都标，更直观"},{"label":"提醒","value":"看书本声调图时，记住『没画线的地方=低音』"}],"audio":null,"source":"04:25 / 05:28"},{"id":"p5-003","deck":"日语声调","group":"声调·数字法","type":"question","front":"『几型』的数字是怎么来的？","answer":"第几个音出现高→低，就是几型","fields":[{"label":"依据","value":"数『高到低』的转折发生在第几个字"},{"label":"记忆方法","value":"从第一个字开始数，数到出现『高→低』的那个字：第4个字降=4型，第5个字降=5型……所以有4型5型6型N型"},{"label":"提醒","value":"4型5型不再神秘，就是数第几个字掉下来"}],"audio":null,"source":"09:17 / 11:16"},{"id":"p5-004","deck":"日语声调","group":"声调·数字法","type":"question","front":"0型是什么意思？","answer":"全程没有高→低（后面一直高）","fields":[{"label":"依据","value":"没有出现降调，所以是0型"},{"label":"记忆方法","value":"0型=不下降：第一个音低，后面全是高，助词也跟着高，一直不落下来"},{"label":"提醒","value":"例：わたし、むらさきいろ 都是0型"}],"audio":null,"source":"10:19 / 15:19"},{"id":"p5-005","deck":"日语声调","group":"声调·数字法","type":"question","front":"1型是什么意思？","answer":"第1音高，后面全低","fields":[{"label":"依据","value":"唯一第一个音是高的类型"},{"label":"记忆方法","value":"1型是特例：第一个字就高，从第二个字开始全部低下去"},{"label":"提醒","value":"除1型外，所有类型的第一个音都是低的"}],"audio":null,"source":"11:23 / 12:18"},{"id":"p5-006","deck":"日语声调","group":"声调·数字法","type":"question","front":"除1型外，第一个音是高还是低？","answer":"低","fields":[{"label":"依据","value":"2型/3型/4型…的第一个音都是低"},{"label":"记忆方法","value":"只有1型第一个音高；0型2型3型4型5型全都第一个音低，然后数第几字降"},{"label":"提醒","value":"为什么不能『高低高再低』？因为违反规律2（降后不再升）"}],"audio":null,"source":"11:16 / 12:18"},{"id":"p5-007","deck":"日语声调"," <script>
/* にほんご SRS — 自用间隔重复闪卡应用
 * 数据: data/cards.json (内置262张) + localStorage 中的自导入卡与学习进度
 * 算法: SM-2 (三档反馈: 忘记 / 模糊 / 认识)
 */
(function () {
'use strict';

var STORE_KEY = 'nihongo_srs_v1';
var DAY = 86400000;

var state = {
  progress: {},   // id -> {level, interval, ef, due, reps, lapses, last}
  custom: [],     // 自导入卡片
  settings: { autoPlay: true },
  stats: {}       // 'YYYY-MM-DD' -> {done, again, hard, good, new}
};

var DATA = null;
var allCards = [];
var cardMap = {};
var session = null;
var curDeck = '全部';
var searchTerm = '';

// ---------- 工具 ----------
function todayStr(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayDiff(a, b) { return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / DAY); }
function addDays(n) { var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return todayStr(d); }
function esc(s) { var div=document.createElement('div'); div.textContent=s==null?'':String(s); return div.innerHTML; }
function $(id) { return document.getElementById(id); }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ---------- 存储 ----------
function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      state.progress = s.progress || {};
      state.custom = s.custom || [];
      state.settings = Object.assign(state.settings, s.settings || {});
      state.stats = s.stats || {};
    }
  } catch (e) { console.warn('load failed', e); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('保存失败：存储空间可能已满'); }
}
function statToday() {
  var k = todayStr();
  if (!state.stats[k]) state.stats[k] = {done:0, again:0, hard:0, good:0, new:0};
  return state.stats[k];
}
function streak() {
  // 连续有复习记录的天数（今天没学也从昨天算起）
  var count = 0;
  var d = new Date(); d.setHours(12,0,0,0);
  var today = todayStr(d);
  if (!state.stats[today] || !state.stats[today].done) d.setDate(d.getDate()-1);
  while (true) {
    var k = todayStr(d);
    if (state.stats[k] && state.stats[k].done > 0) { count++; d.setDate(d.getDate()-1); }
    else break;
  }
  return count;
}

// ---------- SM-2 ----------
// grade: 'again' | 'hard' | 'good'
function schedule(id, grade) {
  var p = state.progress[id] || {level:0, interval:0, ef:2.5, due:todayStr(), reps:0, lapses:0};
  var q = grade === 'again' ? 1 : (grade === 'hard' ? 3 : 5);
  var wasNew = !state.progress[id];

  if (q < 3) {
    p.level = 0; p.reps = 0; p.lapses = (p.lapses||0)+1;
    p.interval = 0; // 当天再复习
    p.due = todayStr();
  } else {
    if (p.level === 0) p.interval = 1;
    else if (p.level === 1) p.interval = 6;
    else p.interval = Math.max(1, Math.round(p.interval * p.ef));
    if (grade === 'hard') p.interval = Math.max(1, Math.round(p.interval * 0.7));
    p.level = (p.level||0) + 1;
    p.reps = (p.reps||0) + 1;
    p.due = addDays(p.interval);
  }
  p.ef = Math.max(1.3, (p.ef||2.5) + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
  p.last = todayStr();
  state.progress[id] = p;

  var st = statToday(); st.done++;
  st[grade] = (st[grade]||0)+1;
  if (wasNew) st.new++;
  return p;
}

// ---------- 队列 ----------
function buildQueue() {
  var t = todayStr();
  var due = [], fresh = [];
  allCards.forEach(function (c) {
    var p = state.progress[c.id];
    if (!p) fresh.push(c);
    else if (p.due <= t) due.push(c);
  });
  // 已取消每日新卡上限：全部新卡一次进入队列
  // 到期卡：先复习间隔短的（更可能忘的在前）
  due.sort(function(a,b){
    var la = state.progress[a.id].level || 0, lb = state.progress[b.id].level || 0;
    return la - lb;
  });
  return due.concat(fresh);
}
function counts() {
  var t = todayStr(), due=0, fresh=0;
  allCards.forEach(function(c){
    var p = state.progress[c.id];
    if (!p) fresh++;
    else if (p.due <= t) due++;
  });
  return { due: due, fresh: fresh, done: (statToday().done||0) };
}

// ---------- 复习会话 ----------
function startSession() {
  var q = buildQueue();
  if (!q.length) { toast('今天没有待复习的卡片了'); return; }
  session = { queue: q, idx: 0, revealed: false, againIds: {} };
  $('session').classList.add('active');
  showCard();
}
function showCard() {
  var s = session;
  if (s.idx >= s.queue.length) { endSession(); return; }
  var c = s.queue[s.idx];
  s.revealed = false;
  $('sessProg').textContent = (s.idx+1) + ' / ' + s.queue.length;
  $('sessBar').style.width = ((s.idx)/s.queue.length*100) + '%';
  var typeName = c.type==='writing' ? '默写' : (c.type==='question' ? '判断' : '认读');
  $('cardChip').textContent = c.deck + ' · ' + (c.group||'') + ' · ' + typeName;
  var face = $('cardFace');
  face.className = 'face' + (c.type==='writing' ? ' writing' : (c.type==='question' ? ' question' : ''));
  face.innerHTML = esc(c.front) + (c.hint ? '<span class="sub">'+esc(c.hint)+'</span>' : '');
  $('answerArea').style.display = 'none';
  $('tapHint').style.display = '';
  $('revealBtn').style.display = '';
  $('revealBtn').textContent = '显示答案';
  $('gradeRow').style.display = 'none';
  var ans = $('answerBig');
  ans.className = 'answer-big' + (String(c.answer).length > 12 ? ' small' : '');
  ans.textContent = c.answer;
  var html = '';
  (c.fields||[]).forEach(function(f){
    if (f.value) html += '<div class="field-row"><div class="field-label">'+esc(f.label)+'</div><div class="field-value">'+esc(f.value)+'</div></div>';
  });
  if (c.source) html += '<div class="field-row"><div class="field-label">视频出处</div><div class="field-value" style="color:#8b92a5;font-size:12px">教日语的阿飞老师 · '+esc(c.source)+'</div></div>';
  $('answerFields').innerHTML = html;
  $('audioBtn').style.display = c.audio ? 'block' : 'none';
  $('audioBtn')._src = c.audio ? (window.__AUDIO__[c.audio] || '') : '';
}
function reveal() {
  if (!session || session.revealed) return;
  session.revealed = true;
  $('answerArea').style.display = '';
  $('tapHint').style.display = 'none';
  $('revealBtn').style.display = 'none';
  $('gradeRow').style.display = 'flex';
  if (state.settings.autoPlay) playAudio();
}
function playAudio() {
  var src = $('audioBtn')._src;
  if (!src) return;
  var a = new Audio(src);
  a.play().catch(function(){});
}
function grade(gradeName) {
  if (!session || !session.revealed) return;
  var c = session.queue[session.idx];
  schedule(c.id, gradeName);
  save();
  // "忘记"的卡片在本轮末尾再出现一次
  if (gradeName === 'again' && !session.againIds[c.id]) {
    session.againIds[c.id] = true;
    session.queue.push(c);
  }
  session.idx++;
  showCard();
}
function endSession() {
  $('session').classList.remove('active');
  session = null;
  renderHome();
  var c = counts();
  toast('完成！今天已复习 ' + c.done + ' 张');
}

// ---------- 渲染 ----------
function renderHome() {
  var c = counts();
  $('dueNum').textContent = c.due;
  $('newNum').textContent = c.fresh;
  $('doneNum').textContent = c.done;
  $('startBtn').textContent = '开始复习（' + (c.due + c.fresh) + '张）';
  $('startBtn').disabled = (c.due + c.fresh === 0);
  $('streakNum').textContent = streak();
}
function renderFilters() {
  var decks = ['全部'].concat(DATA.decks.concat(state.custom.length ? ['我导入的卡'] : []));
  $('deckFilters').innerHTML = decks.map(function(d){
    return '<button class="filter'+(d===curDeck?' active':'')+'" data-deck="'+esc(d)+'">'+esc(d)+'</button>';
  }).join('');
  Array.prototype.forEach.call($('deckFilters').children, function(b){
    b.onclick = function(){ curDeck = b.dataset.deck; renderFilters(); renderLibrary(); };
  });
}
function renderLibrary() {
  var list = allCards.filter(function(c){
    if (curDeck !== '全部') {
      if (curDeck === '我导入的卡') { if (!c.custom) return false; }
      else if (c.deck !== curDeck) return false;
    }
    if (searchTerm) {
      var hay = [c.front,c.answer,c.group,c.deck].concat((c.fields||[]).map(function(f){return f.value;})).join(' ').toLowerCase();
      if (hay.indexOf(searchTerm.toLowerCase()) < 0) return false;
    }
    return true;
  });
  if (!list.length) { $('libList').innerHTML = '<div class="empty">没有匹配的卡片</div>'; return; }
  $('libList').innerHTML = list.map(function(c, i){
    var p = state.progress[c.id];
    var status = !p ? '新卡' : (p.due > todayStr() ? '已安排' : '待复习');
    return '<div class="lib-card" data-i="'+i+'">'+
      '<div class="lib-head"><div><span class="lib-front">'+esc(c.front)+'</span> <span class="tag">'+esc(status)+'</span></div>'+
      '<span class="lib-answer">'+esc(c.answer)+'</span></div>'+
      '<div class="lib-detail">'+(c.fields||[]).filter(function(f){return f.value;}).map(function(f){
        return '<div><b>'+esc(f.label)+'：</b>'+esc(f.value)+'</div>';
      }).join('')+'</div></div>';
  }).join('');
  Array.prototype.forEach.call($('libList').children, function(el){
    el.onclick = function(){ el.classList.toggle('open'); };
  });
  $('libList')._list = list;
}
function renderStats() {
  var t = todayStr(), newC=0, learning=0, mastered=0, lapses=0;
  allCards.forEach(function(c){
    var p = state.progress[c.id];
    if (!p) newC++;
    else if ((p.level||0) >= 4 && (p.interval||0) >= 21) mastered++;
    else learning++;
    lapses += (p && p.lapses) || 0;
  });
  var rows = [
    {n:'未学习', v:newC, color:'#c9c5e8'},
    {n:'学习中', v:learning, color:'#f39c12'},
    {n:'已掌握', v:mastered, color:'#00b894'}
  ];
  $('masteryBars').innerHTML = rows.map(function(r){
    var pct = allCards.length ? Math.round(r.v/allCards.length*100) : 0;
    return '<div class="bar-row"><span class="name">'+r.n+'</span><span class="bar-track"><i style="width:'+pct+'%;background:'+r.color+'"></i></span><span class="val">'+r.v+'</span></div>';
  }).join('') + '<div class="hint-text" style="margin-top:12px">累计忘记次数：'+lapses+' · 卡片总数：'+allCards.length+'</div>';

  var days = [];
  for (var i=6;i>=0;i--) {
    var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i);
    var k = todayStr(d);
    days.push({ k:k, label:['日','一','二','三','四','五','六'][d.getDay()], v:(state.stats[k]&&state.stats[k].done)||0 });
  }
  var max = Math.max(1, Math.max.apply(null, days.map(function(x){return x.v;})));
  $('weekChart').innerHTML = days.map(function(x){
    return '<div class="day"><div class="dnum">'+x.v+'</div><div class="bar" style="height:'+Math.round(x.v/max*72)+'px"></div><div class="dlabel">'+x.label+'</div></div>';
  }).join('');

  var decks = DATA.decks.concat(state.custom.length ? ['我导入的卡'] : []);
  $('deckProgress').innerHTML = decks.map(function(dk){
    var cards = allCards.filter(function(c){ return dk==='我导入的卡' ? c.custom : c.deck===dk; });
    var done = cards.filter(function(c){ return state.progress[c.id] && (state.progress[c.id].level||0)>0; }).length;
    var pct = cards.length ? Math.round(done/cards.length*100) : 0;
    return '<div class="bar-row"><span class="name" style="width:auto;flex:0 0 108px">'+esc(dk)+'</span><span class="bar-track"><i style="width:'+pct+'%;background:#6c5ce7"></i></span><span class="val">'+pct+'%</span></div>';
  }).join('');
}
function renderSettings() {
  $('autoPlay').value = state.settings.autoPlay ? '1' : '0';
}

// ---------- 导入 ----------
function parseImport(text) {
  text = text.trim();
  if (!text) return [];
  var out = [];
  // JSON
  if (text.charAt(0) === '[') {
    try {
      var arr = JSON.parse(text);
      arr.forEach(function(o,i){
        if (o.front && o.answer) out.push(makeCustom(o.front, o.answer, o.fields||[], '导入·'+(o.group||'自定义'), i));
      });
      return out;
    } catch(e) { /* fall through */ }
  }
  // 墨墨 txt: ### 章节 / === 卡 / --- 答案线
  if (text.indexOf('===') >= 0 || text.indexOf('### ') === 0) {
    var deck = '我导入的卡';
    var blocks = text.split(/^===\s*$/m);
    blocks.forEach(function(b, i){
      var sect = b.match(/^###\s+(.+)$/m);
      if (sect) { deck = sect[1].trim(); b = b.replace(/^###\s+.+\n?/m,''); }
      var parts = b.split(/^---\s*$/m);
      if (parts.length < 2) return;
      var front = parts[0].trim(), back = parts.slice(1).join('\n').trim();
      if (!front) return;
      // 第一行作为答案，其余作为详情
      var lines = back.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      out.push(makeCustom(front, lines[0]||'', lines.slice(1).map(function(l){
        var m = l.match(/^([^：:]{2,10})[：:]\s*(.*)$/);
        return m ? {label:m[1], value:m[2]} : {label:'备注', value:l};
      }), deck, i));
    });
    return out;
  }
  // TSV / CSV 每行：正面 ⇥ 背面
  text.split(/\r?\n/).forEach(function(line, i){
    if (!line.trim()) return;
    var sep = line.indexOf('\t') >= 0 ? '\t' : ',';
    var p = line.split(sep);
    if (p.length >= 2 && p[0].trim() && p[1].trim()) {
      out.push(makeCustom(p[0].trim(), p[1].trim(), [], '我导入的卡', i));
    }
  });
  return out;
}
function makeCustom(front, answer, fields, group, i) {
  return {
    id: 'custom-' + Date.now() + '-' + i, deck:'我导入的卡', group:group||'自定义',
    type:'recognition', front:String(front), answer:String(answer), fields:fields,
    audio:null, source:'', custom:true
  };
}
function doImport() {
  var cards = parseImport($('importText').value);
  if (!cards.length) { toast('没有识别到卡片，请检查格式'); return; }
  state.custom = state.custom.concat(cards);
  save(); rebuildCards(); renderFilters(); renderLibrary(); renderHome(); renderStats();
  $('importText').value = '';
  toast('已导入 ' + cards.length + ' 张卡');
}

// ---------- 备份 ----------
function exportBackup() {
  var blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nihongo-srs-backup-' + todayStr() + '.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('备份已下载');
}
function restoreBackup() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var s = JSON.parse(r.result);
        if (!s.progress && !s.custom) throw new Error('bad');
        state.progress = s.progress||{}; state.custom = s.custom||[];
        state.settings = Object.assign({autoPlay:true}, s.settings||{});
        state.stats = s.stats||{};
        save(); rebuildCards(); renderFilters(); renderLibrary(); renderSettings(); renderHome(); renderStats();
        toast('备份已恢复');
      } catch(e) { toast('文件格式不正确'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

// ---------- 初始化 ----------
function rebuildCards() {
  allCards = DATA.cards.concat(state.custom);
  cardMap = {};
  allCards.forEach(function(c){ cardMap[c.id] = c; });
}
function switchTab(name) {
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
    b.classList.toggle('active', b.dataset.tab === name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.view'), function(v){
    v.classList.toggle('active', v.id === 'view-' + name);
  });
  if (name === 'review') renderHome();
  if (name === 'library') { renderFilters(); renderLibrary(); }
  if (name === 'stats') renderStats();
  if (name === 'settings') renderSettings();
}
function bind() {
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
    b.onclick = function(){ switchTab(b.dataset.tab); };
  });
  $('startBtn').onclick = startSession;
  $('closeSession').onclick = function(){
    $('session').classList.remove('active'); session = null; renderHome();
  };
  $('flashcard').onclick = function(){ if (session && !session.revealed) reveal(); };
  $('revealBtn').onclick = reveal;
  $('audioBtn').onclick = function(e){ e.stopPropagation(); playAudio(); };
  Array.prototype.forEach.call(document.querySelectorAll('.grade'), function(b){
    b.onclick = function(){ grade(b.dataset.grade); };
  });
  $('searchInput').oninput = function(){ searchTerm = this.value.trim(); renderLibrary(); };
  $('importBtn').onclick = doImport;
  $('exportBtn').onclick = exportBackup;
  $('restoreBtn').onclick = restoreBackup;
  $('autoPlay').onchange = function(){ state.settings.autoPlay = this.value === '1'; save(); };
  $('resetBtn').onclick = function(){
    if (confirm('确定清空全部学习进度和自导入卡片吗？此操作不可撤销。')) {
      state.progress = {}; state.stats = {}; state.custom = [];
      save(); rebuildCards(); renderFilters(); renderLibrary(); renderHome(); renderStats();
      toast('已重置');
    }
  };
  document.addEventListener('keydown', function(e){
    if (!session || !$('session').classList.contains('active')) return;
    if (e.code === 'Space' && !session.revealed) { e.preventDefault(); reveal(); }
    if (session.revealed && ['1','2','3'].indexOf(e.key)>=0) grade(['again','hard','good'][+e.key-1]);
  });
}
function init() {
  load();
  DATA = window.__DATA__; rebuildCards(); bind(); renderHome(); renderFilters(); renderLibrary(); renderStats(); renderSettings();
}
init();
})();

</script>
